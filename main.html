<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지질공원 통합관리 시스템</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <style>
        /* 기본 글자 크기 변수화 */
        :root { --base-font-size: 16px; }
        body { font-family: 'Pretendard', sans-serif; background-color: #F5F6F8; margin: 0; padding: 20px; color: #191919; box-sizing: border-box; font-size: var(--base-font-size); transition: font-size 0.2s; }
        
        .header { background-color: white; padding: 25px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; display: flex; align-items: center; border-left: 6px solid #FEE500; }
        .profile-icon { width: 50px; height: 50px; background-color: #FEE500; border-radius: 18px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; margin-right: 15px; }
        .user-info .name { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .user-info .role { font-size: 0.85rem; color: #666; margin-top: 4px; }
        .current-badge { background-color: #3498db; color: white; font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; font-weight: 600; }
        .hidden-section { display: none; background-color: white; padding: 20px; border-radius: 16px; margin-top: 10px; border: 1px solid #EAEAEA; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .menu-card { background-color: white; padding: 20px; border-radius: 16px; margin-bottom: 12px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; border: 1px solid #EAEAEA; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #333; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #E5E5E5; border-radius: 10px; font-family: 'Pretendard'; box-sizing: border-box; font-size: 1rem; background-color: #FAFAFA; }
        .btn-act { width: 100%; padding: 15px; margin-bottom: 8px; border: none; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-in { background-color: #FEE500; color: #191919; }
        .btn-move { background-color: #3498db; color: white; }
        .btn-out { background-color: #EAEAEA; color: #191919; }
        .btn-submit { background-color: #3C1E1E; color: #FEE500; width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 700; margin-top: 10px; cursor: pointer; }
        
        /* [신규 추가] 글자 크기 조절 플로팅 버튼 */
        .font-control-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
        .btn-font { width: 45px; height: 45px; border-radius: 50%; border: none; background: #333; color: white; font-weight: bold; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center; }
        .btn-font:active { transform: scale(0.9); }

        #loading_overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .stat-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.9rem; }
        .stat-table th { background-color: #2c3e50; color: white; padding: 10px; border: 1px solid #ddd; }
        .stat-table td { padding: 10px; border: 1px solid #ddd; text-align: center; background: white; }
        .alert-badge { background-color: #e74c3c; color: white; padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; display: inline-block; word-break: keep-all; }

        @media print {
            body * { visibility: hidden; }
            #print_area, #print_area * { visibility: visible; }
            #print_area { display: block; position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="font-control-wrap">
        <button class="btn-font" onclick="changeFontSize(2)">A+</button>
        <button class="btn-font" onclick="changeFontSize(-2)">A-</button>
    </div>

    <div id="loading_overlay">
        <div class="spinner"></div>
        <div style="margin-top:15px; font-weight:bold; color:#2c3e50;">처리 중입니다...</div>
    </div>

    <div class="header">
        <div class="profile-icon">👤</div>
        <div class="user-info">
            <div class="name">
                <span id="name_display">로딩중...</span>
                <span id="current_loc_badge" class="current-badge">미출근</span>
            </div>
            <div id="role_display" class="role">직책 / 소속</div>
        </div>
    </div>

    <div id="leader_dashboard" style="display: none; margin-bottom: 15px;"></div>
    <div id="menu_container"></div>

    <div id="admin_dashboard_area" class="hidden-section">
        <div style="background:#2c3e50; color:white; padding:15px; border-radius:12px; margin-bottom:15px; text-align:center;">
            <h2 style="margin:0; font-size:1.3rem;">🌍 <span id="dash_today_date"></span> 지질공원 통합 현황</h2>
        </div>
        <div class="form-group"><button onclick="loadAdminDashboard()" style="padding:8px 15px; background:#3498db; color:white; border-radius:8px; border:none; cursor:pointer;">새로고침 🔄</button></div>
        <div id="admin_dash_container"></div>
    </div>

    <div id="attendance_area" class="hidden-section">
        <div class="form-group"><label>📅 출퇴근 날짜</label><input type="date" id="attendance_date_input"></div>
        <div class="form-group"><label>📍 기록할 안내소 선택</label><select id="location_select"></select></div>
        <div class="time-input-wrap"><label>⏱ 기록할 시간</label><input type="time" id="action_time_input"></div>
        <button class="btn-act btn-in" onclick="sendAction('출근')">🟢 출근하기</button>
        <button class="btn-act btn-move" onclick="sendAction('이동')">🔵 이동하기</button>
        <button class="btn-act btn-out" onclick="sendAction('퇴근')">🔴 퇴근하기</button>
    </div>

    <div id="log_area" class="hidden-section">
        <div class="form-group"><label>📅 날짜 선택</label><input type="date" id="log_date_input" onchange="loadTodayLogs()"></div>
        <div class="form-group"><label>📍 작성할 안내소</label><select id="log_location_select" onchange="loadTodayLogs()"></select></div>
        <div class="form-group"><label>⏱ 시간대 선택</label><select id="log_time_select" onchange="renderLogTimeSlot()"></select></div>
        <div id="log_sessions_container"></div>
        <button class="btn-act btn-move" style="padding:10px;" onclick="addSessionRow()">➕ 회차 추가</button>
        <div class="form-group"><label>📝 특이사항</label><textarea id="log_remarks" rows="3"></textarea></div>
        <button class="btn-submit" onclick="submitTimeSlotLogs()">일지 저장(덮어쓰기)</button>
    </div>

    <div id="status_area" class="hidden-section">
        <div class="form-group"><label>📅 날짜 선택</label><input type="date" id="status_date_input" onchange="loadDailyStatus()"></div>
        <div id="status_container"></div>
    </div>

    <div id="plan_area" class="hidden-section">
        <div class="form-group">
            <div id="plan_target_user_group" style="display:none; margin-bottom:10px;"><label>👤 대상자</label><select id="plan_target_user"></select></div>
            <div class="flex-group"><select id="plan_month" style="flex:1;"></select><select id="plan_half" style="flex:1.5;"><option value="1">전반기</option><option value="2">하반기</option></select></div>
            <button class="btn-act btn-move" style="margin-top:10px;" onclick="generatePlanForm()">📝 양식 펼치기</button>
        </div>
        <div id="plan_list_container" style="display:none; margin-top:20px; border-top:2px dashed #CCC; padding-top:20px;">
            <div class="time-input-wrap">
                <div style="display:flex; justify-content:space-between; font-size:0.8rem; font-weight:600; color:#555;"><div>📍 안내소</div><div>⏰ 출근</div><div>⏰ 퇴근</div></div>
                <div class="flex-group"><select id="batch_loc"></select><select id="batch_start"></select><span>~</span><select id="batch_end"></select></div>
                <button onclick="applyBatchSettings()" style="width:100%; margin-top:10px; padding:10px; background:#2c3e50; color:white; border:none; border-radius:8px;">일괄 적용</button>
            </div>
            <div id="plan_rows"></div>
            <button class="btn-submit" onclick="submitBulkPlan()">🚀 제출하기</button>
        </div>
    </div>

    <div id="change_area" class="hidden-section">
        <div class="form-group" id="change_target_user_group" style="display:none;"><label>👤 대상자</label><select id="change_target_user" onchange="loadGuideList()"></select></div>
        <div class="form-group"><label>📅 날짜</label><input type="date" id="change_target_date"></div>
        <div class="form-group"><select id="change_type" onchange="updateChangeUI()"><option value="시간 변경">시간 변경</option><option value="해설사 변경(대타)">해설사 변경</option><option value="계획 취소">계획 취소</option></select></div>
        <div id="change_ui_time" class="time-input-wrap"><div class="flex-group"><select id="change_time_start"></select><span>~</span><select id="change_time_end"></select></div></div>
        <div id="change_ui_guide" class="time-input-wrap" style="display:none;"><select id="change_target_guide"></select></div>
        <div id="change_ui_cancel" class="time-input-wrap" style="display:none;"><label style="color:#e74c3c;">휴무 전환</label></div>
        <div class="form-group"><textarea id="change_remarks" rows="2" placeholder="사유"></textarea></div>
        <button class="btn-submit" onclick="submitPlanChange()">요청하기</button>
    </div>

    <div id="my_plan_area" class="hidden-section"><div id="my_plan_container"></div></div>

    <div id="my_activity_area" class="hidden-section">
        <div class="form-group">
            <div class="flex-group">
                <select id="ma_year"><option value="" disabled selected>연도</option><option value="2025">2025년</option><option value="2026">2026년</option></select>
                <select id="ma_month"></select>
                <select id="ma_day"></select>
            </div>
            <button class="btn-submit" onclick="loadMyActivity()">조회하기</button>
        </div>
        <div id="my_activity_container"></div>
    </div>

    <div id="approval_area" class="hidden-section">
        <div class="flex-group" style="margin-bottom:10px;"><select id="approval_filter_loc"><option value="all">전체 안내소</option></select><select id="approval_filter_name"><option value="all">전체 해설사</option></select></div>
        <div id="approval_header" class="approval-header" style="display:none;"><label><input type="checkbox" id="chk_all" onclick="toggleAllApprovals(this)"> 전체 선택</label><div style="display:flex; gap:5px;"><button class="btn-act btn-in" style="padding:8px; margin:0;" onclick="processBulkApp('승인완료')">승인</button><button class="btn-act btn-out" style="padding:8px; margin:0;" onclick="processBulkApp('반려')">반려</button></div></div>
        <div id="pending_container"></div>
    </div>

    <div id="team_plan_area" class="hidden-section">
        <div class="flex-group"><select id="tp_month"></select><select id="tp_half"><option value="all">전체</option><option value="1">전반기</option><option value="2">하반기</option></select></div>
        <div class="flex-group"><select id="tp_loc"></select><input type="text" id="tp_name" placeholder="이름"></div>
        <button class="btn-submit" onclick="loadTeamPlans()">검색</button>
        <div id="team_plan_container"></div>
    </div>

    <div id="admin_stats_area" class="hidden-section">
        <div class="flex-group"><select id="stat_year"><option value="2025">2025년</option><option value="2026" selected>2026년</option></select><select id="stat_month"></select></div>
        <button class="btn-submit" onclick="loadStatistics()">통계 산출</button>
        <div id="stat_container"></div>
    </div>

    <div class="logout" onclick="logout()">로그아웃</div>
    <div id="print_area"></div>

    <script>
        const API_BASE = "https://geopark-system-production.up.railway.app";
        const userName = localStorage.getItem("user_name");
        const userRole = localStorage.getItem("user_role");
        const userIsland = localStorage.getItem("user_island");
        let currentLoc = localStorage.getItem("current_location") || "미출근";

        // [신규 추가] 글자 크기 조절 함수
        function changeFontSize(delta) {
            const root = document.documentElement;
            let currentSize = parseInt(getComputedStyle(root).getPropertyValue('--base-font-size'));
            let newSize = currentSize + delta;
            if(newSize < 12) newSize = 12;
            if(newSize > 24) newSize = 24;
            root.style.setProperty('--base-font-size', newSize + 'px');
        }

        function showLoading() { document.getElementById('loading_overlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading_overlay').style.display = 'none'; }

        if (!userName) location.href = "index.html";
        document.getElementById('name_display').innerText = userName + " 님";
        document.getElementById('role_display').innerText = `[${userRole}] ${userIsland || '관리자'}`;
        
        function updateCurrentLocBadge() {
            if(userRole === '관리자') { document.getElementById('current_loc_badge').style.display = 'none'; return; }
            const badge = document.getElementById('current_loc_badge');
            badge.innerText = currentLoc;
            badge.style.backgroundColor = currentLoc === "미출근" ? "#95a5a6" : "#3498db";
        }
        updateCurrentLocBadge();

        async function checkPendingForLeader() {
            if (userRole !== '조장') return; 
            try {
                const res = await fetch(`${API_BASE}/get_pending_requests?island=${encodeURIComponent(userIsland)}`);
                const data = await res.json();
                const total = data.plans.length + data.changes.length;
                const dash = document.getElementById('leader_dashboard');
                if (total > 0) {
                    dash.style.display = 'block';
                    dash.innerHTML = `<div class="menu-card" style="background:#fff3e0; border-left:6px solid #e67e22;" onclick="goToApproval()">🔔 결재 대기 <b>${total}</b>건이 있습니다.</div>`;
                } else { dash.style.display = 'none'; }
            } catch (e) {}
        }

        function goToApproval() {
            document.querySelectorAll('.hidden-section').forEach(el => el.style.display = 'none');
            document.getElementById('approval_area').style.display = 'block';
            loadPendingRequests();
        }

        const myLocations = (userIsland && userIsland.includes('백령')) ? ['백령센터', '두무진', '용틀임바위', '진촌리 현무암', '콩돌해안', '사곶해변', '용기포신항'] :
                           (userIsland && userIsland.includes('대청')) ? ['선진동', '서풍받이', '농여해변', '옥죽동 해안사구'] :
                           (userIsland && userIsland.includes('소청')) ? ['탑동', '분바위'] : ['거점센터'];
        
        const locSelect = document.getElementById('location_select');
        const logLocSelect = document.getElementById('log_location_select');
        const batchLocSelect = document.getElementById('batch_loc');
        myLocations.forEach(loc => {
            if(locSelect) locSelect.add(new Option(loc, loc));
            if(logLocSelect) logLocSelect.add(new Option(loc, loc));
        });
        if(batchLocSelect) batchLocSelect.innerHTML = `<option value="휴무">휴무</option>` + myLocations.map(l => `<option value="${l}">${l}</option>`).join('');

        const currentMonth = (new Date().getMonth() + 1).toString();
        ['plan_month', 'tp_month', 'stat_month', 'ma_month'].forEach(id => {
            let el = document.getElementById(id);
            if(el) {
                if(id === 'ma_month') el.innerHTML = '<option value="" disabled selected>월</option>';
                for(let i=1; i<=12; i++) el.innerHTML += `<option value="${i}">${i}월</option>`;
                if(id !== 'ma_month') el.value = currentMonth;
            }
        });

        const maDayEl = document.getElementById('ma_day');
        if(maDayEl) {
            maDayEl.innerHTML = `<option value="" disabled selected>일</option><option value="all">전체 (월)</option>`;
            for(let i=1; i<=31; i++) { maDayEl.innerHTML += `<option value="${i < 10 ? '0'+i : i}">${i}일</option>`; }
        }

        const nowOffset = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];
        ['attendance_date_input', 'log_date_input', 'status_date_input'].forEach(id => {
            let el = document.getElementById(id);
            if(el) el.value = nowOffset;
        });

        let timeOptionsHtml = '';
        for(let i=6; i<=20; i++) { 
            let h = i < 10 ? '0'+i : i; 
            timeOptionsHtml += `<option value="${h}:00">${h}:00</option><option value="${h}:30">${h}:30</option>`;
        }
        ['batch_start', 'batch_end', 'change_time_start', 'change_time_end'].forEach(id => {
            let el = document.getElementById(id);
            if(el) { el.innerHTML = timeOptionsHtml; }
        });

        let timeSlotHtml = '';
        for(let i=7; i<=18; i++) {
            let s = i<10 ? '0'+i : i; let e = (i+1)<10 ? '0'+(i+1) : (i+1);
            timeSlotHtml += `<option value="${s}:00~${e}:00">${s}:00 ~ ${e}:00</option>`;
        }
        document.getElementById('log_time_select').innerHTML = timeSlotHtml;

        const currentMenuData = (userRole === '해설사') ? ['1. 출퇴근관리', '2. 안내소 운영일지 작성', '3. 활동계획서 작성', '4. 활동계획 변경', '5. 나의 활동계획 조회', '6. 나의 활동 현황'] :
                                (userRole === '조장') ? ['1. 출퇴근관리', '2. 안내소 운영일지 작성', '3. 출퇴근 및 활동 현황 조회', '4. 활동계획서 작성', '5. 활동계획 변경', '6. 활동계획 및 변경 승인', '7. 나의 활동계획 조회', '8. 조원 활동계획 조회', '10. 나의 활동 현황'] :
                                ['0. 오늘 통합 현황', '1. 해설사 출퇴근 현황', '2. 해설사 활동 현황', '3. 활동계획서 조회', '4. 통계'];

        currentMenuData.forEach(m => {
            const d = document.createElement('div');
            d.className = 'menu-card'; d.innerText = m;
            d.onclick = () => {
                document.querySelectorAll('.hidden-section').forEach(el => el.style.display = 'none');
                if(m.includes('오늘 통합 현황')) { document.getElementById('admin_dashboard_area').style.display = 'block'; loadAdminDashboard(); }
                else if(m.includes('출퇴근관리')) { document.getElementById('attendance_area').style.display = 'block'; setCurrentTimeInput(); }
                else if(m.includes('운영일지 작성')) { document.getElementById('log_area').style.display = 'block'; loadTodayLogs(); }
                else if(m.includes('활동계획서 작성')) { document.getElementById('plan_area').style.display = 'block'; if(userRole !== '해설사') loadPlanTargetUsers('plan_target_user', 'plan_target_user_group'); }
                else if(m.includes('활동계획 변경')) { document.getElementById('change_area').style.display = 'block'; loadGuideList(); if(userRole !== '해설사') loadPlanTargetUsers('change_target_user', 'change_target_user_group'); }
                else if(m.includes('변경 승인')) { document.getElementById('approval_area').style.display = 'block'; loadPendingRequests(); }
                else if(m.includes('나의 활동 현황')) { document.getElementById('my_activity_area').style.display = 'block'; }
                else if(m.includes('통계')) { document.getElementById('admin_stats_area').style.display = 'block'; }
                else if(m.includes('출퇴근 현황')) { document.getElementById('status_area').style.display = 'block'; loadDailyStatus(); }
                else if(m.includes('활동계획 조회')) { document.getElementById('team_plan_area').style.display = 'block'; }
            };
            document.getElementById('menu_container').appendChild(d);
        });

        async function sendAction(action) {
            const loc = document.getElementById('location_select').value;
            const time = document.getElementById('action_time_input').value;
            const date = document.getElementById('attendance_date_input').value;
            if(!time || !date) return;
            showLoading();
            const res = await fetch(`${API_BASE}/record`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: userName, island: userIsland, role: userRole, action, location: loc, action_time: time, action_date: date })
            });
            hideLoading();
            if(res.ok) { alert(action + " 완료!"); syncMyStatus(); }
        }

        let todayLogDataByTime = {};
        async function loadTodayLogs() {
            const loc = document.getElementById('log_location_select').value;
            const date = document.getElementById('log_date_input').value;
            showLoading();
            const res = await fetch(`${API_BASE}/get_today_logs?name=${encodeURIComponent(userName)}&loc=${encodeURIComponent(loc)}&target_date=${date}`);
            const data = await res.json();
            todayLogDataByTime = {};
            if(data.logs) {
                data.logs.forEach(log => {
                    const t = log.time.replace(/\s/g,'');
                    if(!todayLogDataByTime[t]) todayLogDataByTime[t] = { sessions: [], remark: log.rmk };
                    todayLogDataByTime[t].sessions.push(log);
                });
            }
            renderLogTimeSlot();
            hideLoading();
        }

        function renderLogTimeSlot() {
            const t = document.getElementById('log_time_select').value.replace(/\s/g,'');
            const container = document.getElementById('log_sessions_container');
            container.innerHTML = '';
            const existing = todayLogDataByTime[t];
            document.getElementById('log_remarks').value = existing ? existing.remark : '';
            if(existing) {
                existing.sessions.forEach((s, i) => addSessionRow(i+1, s));
                for(let i=existing.sessions.length+1; i<=3; i++) addSessionRow(i);
            } else { [1,2,3].forEach(i => addSessionRow(i)); }
        }

        function addSessionRow(idx, data = null) {
            const row = document.createElement('div');
            row.className = 'session-row'; row.style = 'background:#fff; border:1px solid #ddd; padding:12px; border-radius:8px; margin-bottom:10px;';
            row.innerHTML = `<div style="display:flex; justify-content:space-between;"><b>${idx || ''}회차</b><label><input type="checkbox" class="s-co" ${data?.is_co==='O'?'checked':''}> 공동</label></div>
            <div class="flex-group">
                <input type="number" class="s-v" value="${data?data.v:0}" placeholder="탐방객">
                <input type="number" class="s-l" value="${data?data.l:0}" placeholder="청취자">
                <input type="number" class="s-c" value="${data?data.c:0}" placeholder="횟수">
            </div>`;
            document.getElementById('log_sessions_container').appendChild(row);
        }

        async function submitTimeSlotLogs() {
            const loc = document.getElementById('log_location_select').value;
            const t = document.getElementById('log_time_select').value;
            const date = document.getElementById('log_date_input').value;
            let sessions = [];
            document.querySelectorAll('.session-row').forEach(row => {
                sessions.push({ v: parseInt(row.querySelector('.s-v').value)||0, l: parseInt(row.querySelector('.s-l').value)||0, c: parseInt(row.querySelector('.s-c').value)||0, is_co: row.querySelector('.s-co').checked?'O':'X' });
            });
            showLoading();
            await fetch(`${API_BASE}/save_timeslot_logs`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: userName, island: userIsland, role: userRole, log_location: loc, target_date: date, target_time: t, remarks: document.getElementById('log_remarks').value, sessions })
            });
            hideLoading(); alert("저장되었습니다."); loadTodayLogs();
        }

        async function loadAdminDashboard() {
            showLoading();
            const res = await fetch(`${API_BASE}/get_admin_dashboard`);
            const data = await res.json();
            let html = '';
            ['백령도', '대청도', '소청도'].forEach(isl => {
                html += `<div class="admin-island-card"><div class="admin-island-header">🏝️ ${isl}</div><div style="padding:15px;">`;
                for(const [loc, info] of Object.entries(data.dashboard[isl])) {
                    html += `<div style="margin-bottom:12px;"><b>📍 ${loc}</b><br><small>계획: ${info.plan.join(', ')} / 실제: ${info.act.join(', ')}</small>
                    <div style="display:flex; gap:10px; background:#f8f9fa; padding:5px; border-radius:5px; font-size:0.8rem;">
                        <div>탐방객 <b>${info.v}</b></div><div>청취자 <b>${info.l}</b></div><div>해설 <b>${info.c}</b></div>
                    </div></div>`;
                }
                html += `</div></div>`;
            });
            document.getElementById('admin_dash_container').innerHTML = html;
            hideLoading();
        }

        async function loadMyActivity() {
            const y = document.getElementById('ma_year').value; const m = document.getElementById('ma_month').value; const d = document.getElementById('ma_day').value;
            if(!y || !m || !d) { alert("연/월/일을 선택하세요."); return; }
            showLoading();
            const res = await fetch(`${API_BASE}/get_my_activity?name=${encodeURIComponent(userName)}&year=${y}&month=${m}&day=${d}`);
            const data = await res.json();
            let html = `<div style="background:#e3f2fd; padding:15px; border-radius:12px; margin-bottom:15px; text-align:center;"><b>총 ${data.total_hours}시간 근무</b><br><small>탐방객 ${data.total_v} / 청취자 ${data.total_l} / 해설 ${data.total_c}</small></div>`;
            data.records.forEach(r => {
                html += `<div class="menu-card" style="display:block; font-size:0.9rem;"><b>${r.date} ${r.time}</b><br>📍 ${r.loc} (탐방객 ${r.v} / 청취자 ${r.l} / 해설 ${r.c})<br><small>${r.rmk || ''}</small></div>`;
            });
            document.getElementById('my_activity_container').innerHTML = html;
            hideLoading();
        }

        async function loadStatistics() {
            showLoading();
            const res = await fetch(`${API_BASE}/get_statistics?year=${document.getElementById('stat_year').value}&month=${document.getElementById('stat_month').value}`);
            const data = await res.json();
            let html = `<table class="stat-table"><thead><tr><th>이름</th><th>시간</th><th>실적(횟수)</th><th>알림</th></tr></thead><tbody>`;
            Object.entries(data.guide_stats).forEach(([name, s]) => {
                let alertHtml = s.alerts.map(a => `<span class="alert-badge">${a}</span>`).join('<br>');
                html += `<tr><td>${name}</td><td>${s.hours}h</td><td>${s.count}회</td><td>${alertHtml}</td></tr>`;
            });
            html += `</tbody></table>`;
            document.getElementById('stat_container').innerHTML = html;
            hideLoading();
        }

        function loadPlanTargetUsers(sid, gid) {
            document.getElementById(gid).style.display = 'block';
            fetch(`${API_BASE}/get_guides?island=${encodeURIComponent(userIsland)}&exclude_name=none`).then(r=>r.json()).then(d=>{
                let el = document.getElementById(sid); el.innerHTML = `<option value="${userName}">본인</option>` + d.guides.filter(g=>g!==userName).map(g=>`<option value="${g}">${g}</option>`).join('');
            });
        }

        function logout() { if(confirm("로그아웃 하시겠습니까?")) { localStorage.clear(); location.href = "index.html"; } }
        syncMyStatus().then(checkPendingForLeader);
    </script>
</body>
</html>
