<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지질공원 통합관리 시스템</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <style>
        :root { --base-font-size: 16px; }
        body { font-family: 'Pretendard', sans-serif; background-color: #F5F6F8; margin: 0; padding: 20px; color: #191919; box-sizing: border-box; font-size: var(--base-font-size); transition: font-size 0.2s; }
        .header { background-color: white; padding: 25px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; display: flex; align-items: center; border-left: 6px solid #FEE500; }
        .profile-icon { width: 50px; height: 50px; background-color: #FEE500; border-radius: 18px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; margin-right: 15px; }
        .user-info .name { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .user-info .role { font-size: 0.85rem; color: #666; margin-top: 4px; }
        .current-badge { background-color: #3498db; color: white; font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; font-weight: 600; }
        .hidden-section { display: none; background-color: white; padding: 20px; border-radius: 16px; margin-top: 10px; border: 1px solid #EAEAEA; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .menu-card { background-color: white; padding: 20px; border-radius: 16px; margin-bottom: 12px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; border: 1px solid #EAEAEA; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #333; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #E5E5E5; border-radius: 10px; font-family: 'Pretendard'; box-sizing: border-box; font-size: 1rem; background-color: #FAFAFA; }
        .btn-act { width: 100%; padding: 15px; margin-bottom: 8px; border: none; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-in { background-color: #FEE500; color: #191919; }
        .btn-move { background-color: #3498db; color: white; }
        .btn-out { background-color: #EAEAEA; color: #191919; }
        .btn-submit { background-color: #3C1E1E; color: #FEE500; width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 700; margin-top: 10px; cursor: pointer; }
        .font-control-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
        .btn-font { width: 45px; height: 45px; border-radius: 50%; border: none; background: #333; color: white; font-weight: bold; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center; }
        #loading_overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .stat-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.9rem; }
        .stat-table th { background-color: #2c3e50; color: white; padding: 10px; border: 1px solid #ddd; }
        .stat-table td { padding: 10px; border: 1px solid #ddd; text-align: center; background: white; }
        .alert-badge { background-color: #e74c3c; color: white; padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; display: inline-block; }
    </style>
</head>
<body>

    <div class="font-control-wrap">
        <button class="btn-font" onclick="changeFontSize(2)">A+</button>
        <button class="btn-font" onclick="changeFontSize(-2)">A-</button>
    </div>

    <div id="loading_overlay"><div class="spinner"></div><div style="margin-top:15px; font-weight:bold; font-size:1.1rem;">잠시만 기다려주세요...</div></div>

    <div class="header">
        <div class="profile-icon">👤</div>
        <div class="user-info">
            <div class="name"><span id="name_display">로딩중...</span><span id="current_loc_badge" class="current-badge">미출근</span></div>
            <div id="role_display" class="role">직책 / 소속</div>
        </div>
    </div>

    <div id="leader_dashboard" style="display: none; margin-bottom: 15px;"></div>
    <div id="menu_container"></div>

    <div id="admin_dashboard_area" class="hidden-section">
        <div style="background:#2c3e50; color:white; padding:15px; border-radius:12px; margin-bottom:15px; text-align:center;"><h2 style="margin:0; font-size:1.3rem;">🌍 <span id="dash_today_date"></span> 통합 현황</h2></div>
        <div id="admin_dash_container"></div>
    </div>

    <div id="attendance_area" class="hidden-section">
        <div class="form-group"><label>📅 출퇴근 날짜</label><input type="date" id="attendance_date_input"></div>
        <div class="form-group"><label>📍 안내소 선택</label><select id="location_select"></select></div>
        <div class="time-input-wrap"><label>⏱ 기록할 시간</label><input type="time" id="action_time_input"></div>
        <button class="btn-act btn-in" onclick="sendAction('출근')">🟢 출근하기</button>
        <button class="btn-act btn-move" onclick="sendAction('이동')">🔵 이동하기</button>
        <button class="btn-act btn-out" onclick="sendAction('퇴근')">🔴 퇴근하기</button>
    </div>

    <div id="log_area" class="hidden-section">
        <div class="form-group"><label>📅 날짜 선택</label><input type="date" id="log_date_input" onchange="loadTodayLogs()"></div>
        <div class="form-group"><label>📍 안내소</label><select id="log_location_select" onchange="loadTodayLogs()"></select></div>
        <div class="form-group"><label>⏱ 시간대</label><select id="log_time_select" onchange="renderLogTimeSlot()"></select></div>
        <div id="log_sessions_container"></div>
        <button class="btn-act btn-move" style="padding:10px; font-size:0.9rem;" onclick="addSessionRow()">➕ 회차 추가</button>
        <div class="form-group" style="margin-top:15px;"><label>📝 특이사항</label><textarea id="log_remarks" rows="3"></textarea></div>
        <button class="btn-submit" onclick="submitTimeSlotLogs()">일지 저장</button>
    </div>

    <div id="status_area" class="hidden-section">
        <div class="form-group"><label>📅 날짜 선택</label><input type="date" id="status_date_input" onchange="loadDailyStatus()"></div>
        <div id="status_container"></div>
    </div>

    <div id="my_activity_area" class="hidden-section">
        <div class="form-group">
            <div class="flex-group">
                <select id="ma_year"><option value="2025">2025년</option><option value="2026">2026년</option><option value="2027">2027년</option></select>
                <select id="ma_month"></select>
                <select id="ma_day"></select>
            </div>
            <button class="btn-submit" onclick="loadMyActivity()">조회하기</button>
        </div>
        <div id="my_activity_container"></div>
    </div>

    <div id="team_plan_area" class="hidden-section">
        <div class="form-group">
            <div class="flex-group"><select id="tp_month"></select><select id="tp_half"><option value="all">전체</option><option value="1">전반기</option><option value="2">하반기</option></select></div>
            <div class="flex-group"><select id="tp_loc"></select><input type="text" id="tp_name" placeholder="이름 검색"></div>
            <button class="btn-submit" onclick="loadTeamPlans()">조회하기</button>
        </div>
        <div id="team_plan_container"></div>
    </div>

    <div class="logout" onclick="logout()">로그아웃</div>

    <script>
        const API_BASE = "https://geopark-system-production.up.railway.app"; 
        const userName = localStorage.getItem("user_name");
        const userRole = localStorage.getItem("user_role");
        const userIsland = localStorage.getItem("user_island");
        let currentLoc = "미출근";

        const now = new Date();
        const curY = now.getFullYear().toString();
        const curM = (now.getMonth() + 1).toString();
        const todayStr = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().split('T')[0];

        function changeFontSize(delta) {
            const root = document.documentElement;
            let size = parseInt(getComputedStyle(root).getPropertyValue('--base-font-size')) + delta;
            if(size >= 12 && size <= 26) root.style.setProperty('--base-font-size', size + 'px');
        }

        function showLoading() { document.getElementById('loading_overlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading_overlay').style.display = 'none'; }

        if (!userName) location.href = "index.html";
        document.getElementById('name_display').innerText = userName + " 님";
        document.getElementById('role_display').innerText = `[${userRole}] ${userIsland || '관리자'}`;

        const myLocations = (userIsland?.includes('백령')) ? ['백령센터', '두무진', '용틀임바위', '진촌리 현무암', '콩돌해안', '사곶해변', '용기포신항'] :
                           (userIsland?.includes('대청')) ? ['선진동', '서풍받이', '농여해변', '옥죽동 해안사구'] :
                           (userIsland?.includes('소청')) ? ['탑동', '분바위'] : ['거점센터'];

        ['location_select', 'log_location_select', 'tp_loc'].forEach(id => {
            let el = document.getElementById(id);
            if(el) {
                if(id === 'tp_loc') el.add(new Option("전체 안내소", ""));
                myLocations.forEach(l => el.add(new Option(l, l)));
            }
        });

        ['ma_month', 'tp_month'].forEach(id => {
            let el = document.getElementById(id);
            if(el) {
                for(let i=1; i<=12; i++) el.add(new Option(i+'월', i));
                el.value = curM;
            }
        });

        if(document.getElementById('ma_day')) {
            let el = document.getElementById('ma_day');
            el.add(new Option('전체(월)', 'all'));
            for(let i=1; i<=31; i++) el.add(new Option(i+'일', i < 10 ? '0'+i : i));
        }
        
        document.getElementById('ma_year').value = curY;
        ['attendance_date_input', 'log_date_input', 'status_date_input'].forEach(id => {
            if(document.getElementById(id)) document.getElementById(id).value = todayStr;
        });

        let timeSlotHtml = '';
        for(let i=7; i<=18; i++) {
            let s = i<10 ? '0'+i : i; let e = (i+1)<10 ? '0'+(i+1) : (i+1);
            timeSlotHtml += `<option value="${s}:00~${e}:00">${s}:00 ~ ${e}:00</option>`;
        }
        document.getElementById('log_time_select').innerHTML = timeSlotHtml;

        const menuData = {
            '해설사': ['1. 출퇴근관리', '2. 안내소 운영일지 작성', '5. 나의 활동계획 조회', '6. 나의 활동 현황'],
            '조장': ['1. 출퇴근관리', '2. 안내소 운영일지 작성', '3. 출퇴근 및 활동 현황 조회', '7. 나의 활동계획 조회', '8. 조원 활동계획 조회', '10. 나의 활동 현황'],
            '관리자': ['0. 오늘 통합 현황', '4. 통계']
        };

        const container = document.getElementById('menu_container');
        (menuData[userRole] || menuData['해설사']).forEach(m => {
            const d = document.createElement('div');
            d.className = 'menu-card'; d.innerText = m;
            d.onclick = () => {
                document.querySelectorAll('.hidden-section').forEach(el => el.style.display = 'none');
                if(m.includes('오늘 통합 현황')) { document.getElementById('admin_dashboard_area').style.display = 'block'; loadAdminDashboard(); }
                else if(m.includes('출퇴근관리')) { document.getElementById('attendance_area').style.display = 'block'; }
                else if(m.includes('운영일지 작성')) { document.getElementById('log_area').style.display = 'block'; loadTodayLogs(); }
                else if(m.includes('현황 조회')) { document.getElementById('status_area').style.display = 'block'; loadDailyStatus(); }
                else if(m.includes('조원 활동계획')) { document.getElementById('team_plan_area').style.display = 'block'; loadTeamPlans(); }
                else if(m.includes('나의 활동 현황')) { document.getElementById('my_activity_area').style.display = 'block'; loadMyActivity(); }
            };
            container.appendChild(d);
        });

        async function syncMyStatus() {
            try {
                const res = await fetch(`${API_BASE}/get_my_attendance?name=${encodeURIComponent(userName)}`);
                const data = await res.json();
                currentLoc = data.loc;
                const badge = document.getElementById('current_loc_badge');
                badge.innerText = currentLoc;
                badge.style.backgroundColor = currentLoc === "미출근" ? "#95a5a6" : "#3498db";
            } catch (e) {}
        }

        async function sendAction(action) {
            const loc = document.getElementById('location_select').value;
            const time = document.getElementById('action_time_input').value;
            const date = document.getElementById('attendance_date_input').value;
            if(!time || !date) { alert("날짜와 시간을 입력해주세요."); return; }
            showLoading();
            const res = await fetch(`${API_BASE}/record`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: userName, island: userIsland, role: userRole, action, location: loc, action_time: time, action_date: date })
            });
            hideLoading();
            if(res.ok) { alert(action + " 완료!"); syncMyStatus(); }
        }

        let todayLogDataByTime = {};
        async function loadTodayLogs() {
            const loc = document.getElementById('log_location_select').value;
            const date = document.getElementById('log_date_input').value;
            showLoading();
            const res = await fetch(`${API_BASE}/get_today_logs?name=${encodeURIComponent(userName)}&loc=${encodeURIComponent(loc)}&target_date=${date}`);
            const data = await res.json();
            todayLogDataByTime = {};
            if(data.logs) {
                data.logs.forEach(log => {
                    const t = log.time.replace(/\s/g,'');
                    if(!todayLogDataByTime[t]) todayLogDataByTime[t] = { sessions: [], remark: log.rmk };
                    todayLogDataByTime[t].sessions.push(log);
                });
            }
            renderLogTimeSlot();
            hideLoading();
        }

        function renderLogTimeSlot() {
            const t = document.getElementById('log_time_select').value.replace(/\s/g,'');
            const container = document.getElementById('log_sessions_container');
            container.innerHTML = '';
            const existing = todayLogDataByTime[t];
            document.getElementById('log_remarks').value = existing ? existing.remark : '';
            if(existing && existing.sessions.length > 0) {
                existing.sessions.forEach((s, i) => addSessionRow(i+1, s));
                for(let i=existing.sessions.length+1; i<=3; i++) addSessionRow(i);
            } else { [1,2,3].forEach(i => addSessionRow(i)); }
        }

        function addSessionRow(idx, data = null) {
            const row = document.createElement('div');
            row.className = 'session-row'; row.style = 'background:#fff; border:1px solid #ddd; padding:12px; border-radius:8px; margin-bottom:10px;';
            row.innerHTML = `<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><b>${idx}회차</b><label><input type="checkbox" class="s-co" ${data?.is_co==='O'?'checked':''}> 공동해설</label></div>
            <div style="display:flex; gap:10px;">
                <input type="number" class="s-v" value="${data?data.v:0}" style="flex:1; text-align:center;">
                <input type="number" class="s-l" value="${data?data.l:0}" style="flex:1; text-align:center;">
                <input type="number" class="s-c" value="${data?data.c:0}" style="flex:1; text-align:center;">
            </div>`;
            document.getElementById('log_sessions_container').appendChild(row);
        }

        async function submitTimeSlotLogs() {
            const loc = document.getElementById('log_location_select').value;
            const t = document.getElementById('log_time_select').value;
            const date = document.getElementById('log_date_input').value;
            let sessions = [];
            document.querySelectorAll('.session-row').forEach(row => {
                sessions.push({ v: parseInt(row.querySelector('.s-v').value)||0, l: parseInt(row.querySelector('.s-l').value)||0, c: parseInt(row.querySelector('.s-c').value)||0, is_co: row.querySelector('.s-co').checked?'O':'X' });
            });
            showLoading();
            await fetch(`${API_BASE}/save_timeslot_logs`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: userName, island: userIsland, role: userRole, log_location: loc, target_date: date, target_time: t, remarks: document.getElementById('log_remarks').value, sessions })
            });
            hideLoading(); alert("저장되었습니다."); loadTodayLogs();
        }

        async function loadDailyStatus() {
            const container = document.getElementById('status_container');
            const targetDate = document.getElementById('status_date_input').value;
            container.innerHTML = '<p style="text-align:center; padding:20px;">불러오는 중...</p>';
            try {
                const res = await fetch(`${API_BASE}/get_daily_status?island=${encodeURIComponent(userIsland)}&target_date=${targetDate}`);
                const data = await res.json();
                let html = `<div style="background:#fff3e0; padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid #ffe0b2; text-align:center;"><b>${data.target_date} 실적 합계</b><br>탐방객 ${data.log_summary.total_visitors} / 해설 ${data.log_summary.total_count}</div>`;
                for (const [loc, users] of Object.entries(data.attendance)) {
                    html += `<div style="background:white; border:1px solid #ddd; border-radius:12px; margin-bottom:10px; overflow:hidden;"><div style="background:#3498db; color:white; padding:8px 15px; font-weight:bold;">📍 ${loc}</div><div style="padding:10px;">`;
                    users.forEach(u => { html += `<div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:5px;"><span>${u.name}</span><span>${u.in_time} ~ ${u.out_time || '근무중'}</span></div>`; });
                    html += `</div></div>`;
                }
                container.innerHTML = html;
            } catch(e) { container.innerHTML = '<p>데이터가 없습니다.</p>'; }
        }

        async function loadMyActivity() {
            const y = document.getElementById('ma_year').value;
            const m = document.getElementById('ma_month').value;
            const d = document.getElementById('ma_day').value;
            const container = document.getElementById('my_activity_container');
            container.innerHTML = '<p style="text-align:center; padding:20px;">활동 내역을 불러오는 중...</p>';
            try {
                const res = await fetch(`${API_BASE}/get_my_activity?name=${encodeURIComponent(userName)}&year=${y}&month=${m}&day=${d}`);
                const data = await res.json();
                let html = `<div style="background:#e3f2fd; padding:15px; border-radius:12px; margin-bottom:15px; text-align:center;"><b>총 ${data.total_hours}시간 근무</b><br><small>탐방객 ${data.total_v} / 청취자 ${data.total_l} / 해설 ${data.total_c}</small></div>`;
                if(data.records.length === 0) html += '<p style="text-align:center; color:#999;">기록이 없습니다.</p>';
                data.records.forEach(r => {
                    html += `<div class="menu-card" style="display:block; font-size:0.9rem;"><b>${r.date} ${r.time}</b><br>📍 ${r.loc} (탐방객 ${r.v} / 청취자 ${r.l} / 해설 ${r.c})<br><small>${r.rmk || ''}</small></div>`;
                });
                container.innerHTML = html;
            } catch(e) { container.innerHTML = '<p>조회 실패</p>'; }
        }

        // [핵심] 조원 활동계획 조회 시 날짜의 '일(Day)' 형식을 유연하게 파싱
        async function loadTeamPlans() {
            const m = document.getElementById('tp_month').value;
            const half = document.getElementById('tp_half').value;
            const loc = document.getElementById('tp_loc').value;
            const name = document.getElementById('tp_name').value;
            const container = document.getElementById('team_plan_container');
            container.innerHTML = '<p style="text-align:center; padding:20px;">계획서를 불러오는 중...</p>';
            try {
                const res = await fetch(`${API_BASE}/get_island_plans?island=${encodeURIComponent(userIsland)}&month=${m}`);
                const data = await res.json();
                let filtered = data.plans.filter(p => {
                    if(loc && !(p.장소||'').includes(loc)) return false;
                    if(name && !(p.이름||'').includes(name)) return false;
                    
                    let stdDate = p.날짜_표준 || p.날짜 || '';
                    let day = 0;
                    if (stdDate.includes('-')) {
                        day = parseInt(stdDate.split('-')[2]);
                    } else if (stdDate.includes('.')) {
                        day = parseInt(stdDate.split('.')[2]);
                    } else {
                        let mMatch = stdDate.match(/(\d+)일/);
                        if (mMatch) day = parseInt(mMatch[1]);
                    }

                    if(half === '1' && day > 15) return false;
                    if(half === '2' && day <= 15) return false;
                    return true;
                });
                let html = '';
                filtered.forEach(p => {
                    html += `<div class="menu-card" style="display:block; font-size:0.9rem;"><b>${p.날짜} - ${p.이름}</b><br>📍 ${p.장소} (${p.활동여부})<br><small>상태: ${p.상태}</small></div>`;
                });
                container.innerHTML = html || '<p style="text-align:center; padding:20px;">검색 결과가 없습니다.</p>';
            } catch(e) { container.innerHTML = '<p>조회 실패</p>'; }
        }

        async function loadAdminDashboard() {
            showLoading();
            try {
                const res = await fetch(`${API_BASE}/get_admin_dashboard`);
                const data = await res.json();
                let html = '';
                ['백령도', '대청도', '소청도'].forEach(isl => {
                    html += `<div class="admin-island-card"><div class="admin-island-header">🏝️ ${isl}</div><div style="padding:15px;">`;
                    for(const [loc, info] of Object.entries(data.dashboard[isl])) {
                        html += `<div style="margin-bottom:12px; border-bottom:1px dashed #eee; padding-bottom:8px;"><b>📍 ${loc}</b><br><small>계획: ${info.plan.join(', ') || '없음'} / 실제: ${info.act.join(', ') || '미출근'}</small>
                        <div style="display:flex; gap:10px; margin-top:5px; font-size:0.8rem; color:#666;"><div>탐방객 <b>${info.v}</b></div><div>해설 <b>${info.c}</b></div></div></div>`;
                    }
                    html += `</div></div>`;
                });
                document.getElementById('admin_dash_container').innerHTML = html;
            } catch(e) {}
            hideLoading();
        }

        function logout() { if(confirm("로그아웃 하시겠습니까?")) { localStorage.clear(); location.href = "index.html"; } }
        syncMyStatus().then(checkPendingForLeader);
    </script>
</body>
</html>
